name: sup_fun
description: SUP FUN mobile application - Stand-Up Paddleboarding community app
publish_to: "none"
version: 0.2.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  provider: ^6.1.2

  # Networking
  http: ^1.2.2

  # Local storage
  shared_preferences: ^2.3.2
  flutter_secure_storage: 9.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  sqflite: ^2.3.3+1
  path_provider: ^2.1.4

  # Maps & Location
  geolocator: ^13.0.1

  # UI Components
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0

  # Date/Time
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/splash/splash_540.jpg
    - assets/splash/splash_720.jpg
    - assets/splash/splash_1080.jpg
    - assets/splash/splash_1440.jpg
